<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Project Helios traffic intelligence</title><desc id="desc">Illustrated Indian city road with computer vision vehicle detection and lane tracking.</desc>
